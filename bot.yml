name: bot
on:
  schedule:
    - cron: "*/15 13-22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "מצב הרצה"
        type: choice
        options: [test, backtest, live]
        default: test
permissions:
  contents: write
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py ${{ github.event.inputs.mode || 'live' }}
      - name: save state
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "update" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
